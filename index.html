<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%98%95%3C/text%3E%3C/svg%3E"
    />
    <title>ARTISAN CAFÉ · Inventario</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=DM+Sans:wght@400;500;700&family=Cinzel:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f4f1ec;
        --sf: rgba(255, 255, 255, 0.5);
        --sh: rgba(255, 255, 255, 0.82);
        --gb: rgba(255, 255, 255, 0.95);
        --ov: rgba(255, 255, 255, 0.1);
        --tx: #12221f;
        --mu: #44574f;
        --ln: rgba(18, 34, 31, 0.14);
        --ac: #1f7a5c;
        --on: #fff;
        --ac2: rgba(31, 122, 92, 0.16);
        --wn: #e8a13a;
        --bd: #d9534f;
        --ink: #12221f;
        --c1: #1f7a5c;
        --c2: #e8a13a;
        --c3: #4a7fd1;
        --c4: #c9568a;
        --c5: #8a7bd1;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) and (min-width: 99999px) {
        :root:not([data-theme="light"]) {
          --bg: #140c07;
          --sf: rgba(26, 38, 33, 0.5);
          --sh: rgba(16, 26, 22, 0.84);
          --gb: rgba(255, 255, 255, 0.15);
          --ov: rgba(8, 12, 11, 0.76);
          --tx: #e9f2ee;
          --mu: #a9bdb6;
          --ln: rgba(255, 255, 255, 0.14);
          --ac: #4cc79a;
          --on: #08130f;
          --ac2: rgba(76, 199, 154, 0.2);
          --wn: #f0b55a;
          --bd: #ff7b72;
          --ink: #091110;
          --c1: #4cc79a;
          --c2: #f0b55a;
          --c3: #7aa5ee;
          --c4: #e585b0;
          --c5: #ab9ee6;
        }
      }
      :root[data-theme="dark"] {
        --bg: #140c07;
        --sf: rgba(26, 38, 33, 0.5);
        --sh: rgba(16, 26, 22, 0.84);
        --gb: rgba(255, 255, 255, 0.15);
        --ov: rgba(8, 12, 11, 0.76);
        --tx: #e9f2ee;
        --mu: #a9bdb6;
        --ln: rgba(255, 255, 255, 0.14);
        --ac: #4cc79a;
        --on: #08130f;
        --ac2: rgba(76, 199, 154, 0.2);
        --wn: #f0b55a;
        --bd: #ff7b72;
        --ink: #091110;
        --c1: #4cc79a;
        --c2: #f0b55a;
        --c3: #7aa5ee;
        --c4: #e585b0;
        --c5: #ab9ee6;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--tx);
        font:
          15px/1.45 "DM Sans",
          system-ui,
          sans-serif;
      }
      h1,
      h2,
      .k b,
      .br {
        font-family: "Bricolage Grotesque", "DM Sans", system-ui, sans-serif;
        letter-spacing: -0.02em;
      }
      button {
        font: inherit;
        cursor: pointer;
        color: inherit;
      }
      input,
      select,
      textarea {
        font: inherit;
        color: var(--tx);
        background: var(--sf);
        border: 1px solid var(--ln);
        border-radius: 12px;
        padding: 10px 12px;
        width: 100%;
      }
      :focus-visible {
        outline: 2px solid var(--ac);
        outline-offset: 1px;
      }
      .app {
        display: grid;
        grid-template-columns: 220px 1fr;
        min-height: 100vh;
      }
      aside {
        background: var(--ink);
        color: #dfece6;
        padding: 22px 12px;
        position: sticky;
        top: 0;
        align-self: start;
        max-height: 100vh;
        overflow: auto;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .br {
        font-family: Cinzel, "Trajan Pro", Georgia, serif;
        font-weight: 600;
        font-size: 21px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #fff;
        line-height: 1.5;
        padding: 4px 10px 22px;
        text-shadow: none;
      }
      aside button {
        display: flex;
        gap: 10px;
        align-items: center;
        background: none;
        border: 0;
        border-radius: 12px;
        padding: 10px 12px;
        text-align: left;
        color: #b8cdc5;
      }
      aside button.on {
        background: rgba(255, 255, 255, 0.13);
        color: #fff;
      }
      aside i {
        font-style: normal;
        display: grid;
      }
      aside svg {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      main {
        padding: 26px 28px 120px;
        max-width: 1040px;
        width: 100%;
      }
      .hd {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: flex-end;
        flex-wrap: wrap;
        margin-bottom: 18px;
      }
      h1 {
        font-size: 30px;
        margin: 0;
      }
      h2 {
        font-size: 17px;
        margin: 0 0 12px;
      }
      .mu {
        color: var(--mu);
        font-size: 13px;
      }
      p {
        margin: 4px 0;
      }
      .btn {
        background: var(--ac);
        color: var(--on);
        border: 0;
        border-radius: 999px;
        padding: 10px 18px;
        font-weight: 600;
      }
      .btn.s {
        background: var(--ac2);
        color: var(--ac);
        padding: 7px 13px;
      }
      .btn.g {
        background: transparent;
        color: var(--ac);
        border: 1px solid var(--ln);
      }
      .btn.x {
        background: none;
        color: var(--bd);
        padding: 7px 10px;
      }
      .kp {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 12px;
        margin-bottom: 16px;
      }
      .k {
        border-radius: 18px;
        padding: 16px;
        background: var(--ac2);
      }
      .k b {
        display: block;
        font-size: 26px;
        margin-top: 4px;
      }
      .k.w {
        background: color-mix(in srgb, var(--wn) 22%, var(--sf));
      }
      .k.r {
        background: color-mix(in srgb, var(--bd) 18%, var(--sf));
      }
      .k.n {
        background: var(--sf);
        border: 1px solid var(--ln);
      }
      .g2 {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 14px;
      }
      .cd {
        background: var(--sf);
        border: 1px solid var(--ln);
        border-radius: 16px;
        padding: 16px;
        margin-bottom: 14px;
      }
      .ch {
        width: 100%;
        height: auto;
      }
      .ch rect {
        fill: var(--ac2);
        transition: fill 0.15s;
      }
      .ch rect:hover,
      .ch rect.hi {
        fill: var(--ac);
      }
      .ch text {
        fill: var(--mu);
        font-size: 9px;
      }
      .ch .vl {
        font-size: 8px;
        fill: var(--tx);
      }
      .dn {
        display: flex;
        gap: 14px;
        align-items: center;
        flex-wrap: wrap;
      }
      .dt {
        font-size: 4.4px;
        font-weight: 700;
        fill: var(--tx);
      }
      .lg {
        list-style: none;
        padding: 0;
        margin: 0;
        flex: 1;
        min-width: 120px;
      }
      .lg li {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 3px 0;
        font-size: 13px;
      }
      .lg i {
        width: 10px;
        height: 10px;
        border-radius: 3px;
      }
      .lg b {
        margin-left: auto;
      }
      .hb {
        display: grid;
        grid-template-columns: 110px 1fr 70px;
        gap: 8px;
        align-items: center;
        margin: 7px 0;
        font-size: 13px;
      }
      .hb div {
        height: 10px;
        background: var(--ln);
        border-radius: 9px;
        overflow: hidden;
      }
      .hb i {
        display: block;
        height: 100%;
        background: var(--ac);
        border-radius: 9px;
      }
      .hb span:last-child {
        text-align: right;
        color: var(--mu);
      }
      .gg {
        position: relative;
        height: 8px;
        background: var(--ln);
        border-radius: 9px;
        min-width: 60px;
        margin-top: 6px;
      }
      .gg i {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        border-radius: 9px;
      }
      .gg i.ok {
        background: var(--ac);
      }
      .gg i.wn {
        background: var(--wn);
      }
      .gg i.bd {
        background: var(--bd);
      }
      .gg u {
        position: absolute;
        top: -3px;
        bottom: -3px;
        width: 2px;
        background: var(--tx);
        opacity: 0.45;
      }
      .rw {
        border-bottom: 1px solid var(--ln);
      }
      .rh {
        display: grid;
        grid-template-columns: minmax(120px, 1.2fr) 1.4fr 90px;
        gap: 14px;
        align-items: center;
        padding: 12px 4px;
        cursor: pointer;
      }
      .rh .gg {
        margin: 0;
      }
      .qt {
        text-align: right;
        font-weight: 600;
      }
      .low {
        color: var(--bd);
      }
      .rx {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
        padding: 0 4px 14px;
      }
      .rx input {
        width: 110px;
      }
      .rx select {
        width: auto;
      }
      .tb2 {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 10px;
      }
      .se {
        max-width: 260px;
      }
      .chips {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .chips button {
        border: 1px solid var(--ln);
        background: var(--sf);
        border-radius: 999px;
        padding: 6px 13px;
      }
      .chips button.on {
        background: var(--ink);
        color: #fff;
        border-color: var(--ink);
      }
      .tg {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 12px;
        margin-bottom: 18px;
      }
      .tl {
        position: relative;
        background: var(--sf);
        border: 1px solid var(--ln);
        border-radius: 18px;
        overflow: hidden;
        cursor: pointer;
        user-select: none;
        transition: transform 0.12s;
      }
      .tl:active {
        transform: scale(0.97);
      }
      .tl.sel {
        border-color: var(--ac);
        box-shadow: 0 0 0 2px var(--ac);
      }
      .tl.off {
        opacity: 0.55;
      }
      .tl img,
      .ph {
        width: 100%;
        height: 110px;
        object-fit: cover;
        display: block;
        font-family: "Bricolage Grotesque", sans-serif;
        font-weight: 700;
        color: var(--ac);
      }
      .ph {
        display: grid;
        place-items: center;
        font-size: 38px;
        background: linear-gradient(
          135deg,
          var(--ac2),
          color-mix(in srgb, var(--wn) 30%, var(--sf))
        );
      }
      .tb {
        padding: 10px 12px;
      }
      .tb b {
        display: block;
      }
      .qb {
        position: absolute;
        top: 8px;
        right: 8px;
        display: flex;
        align-items: center;
        background: var(--ac);
        color: var(--on);
        border-radius: 999px;
        padding: 2px;
      }
      .qb button {
        background: none;
        border: 0;
        color: inherit;
        width: 28px;
        height: 28px;
        font-size: 18px;
        border-radius: 50%;
      }
      .qb span {
        min-width: 20px;
        text-align: center;
        font-weight: 700;
      }
      #fab {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 20px;
        display: flex;
        justify-content: center;
        pointer-events: none;
        z-index: 20;
      }
      .pill {
        pointer-events: auto;
        display: flex;
        gap: 10px;
        align-items: center;
        background: var(--ink);
        color: #fff;
        border-radius: 999px;
        padding: 8px 8px 8px 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      }
      .pill .g {
        color: #fff;
        border-color: #ffffff40;
      }
      .li {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: center;
        padding: 10px 0;
        border-bottom: 1px solid var(--ln);
      }
      .li:last-child,
      .rw:last-child {
        border: 0;
      }
      .empty {
        text-align: center;
        padding: 50px 16px;
      }
      .empty .btn {
        margin: 6px;
      }
      .pr {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 14px;
      }
      .pc {
        background: var(--sf);
        border: 1px solid var(--ln);
        border-radius: 18px;
        overflow: hidden;
      }
      .pc .tb {
        padding: 14px;
      }
      .pc img,
      .pc .ph {
        height: 140px;
      }
      .pc pre {
        white-space: pre-wrap;
        font: inherit;
        margin: 4px 0;
        color: var(--mu);
        font-size: 13px;
      }
      .mg {
        display: inline-block;
        background: var(--ac2);
        color: var(--ac);
        border-radius: 999px;
        padding: 2px 10px;
        font-size: 12px;
        font-weight: 700;
      }
      #mo {
        position: fixed;
        inset: 0;
        background: rgba(5, 15, 12, 0.55);
        display: none;
        align-items: flex-end;
        justify-content: center;
        z-index: 50;
      }
      #mo.on {
        display: flex;
      }
      .sh {
        background: var(--sf);
        width: min(560px, 100%);
        max-height: 92%;
        overflow: auto;
        border-radius: 22px 22px 0 0;
        padding: 20px;
        animation: up 0.2s;
      }
      @keyframes up {
        from {
          transform: translateY(30px);
          opacity: 0;
        }
      }
      .sht {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .x2 {
        background: var(--ln);
        border: 0;
        border-radius: 50%;
        width: 32px;
        height: 32px;
      }
      .fm {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .fm label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 12px;
        color: var(--mu);
      }
      .fm .w2 {
        grid-column: 1/-1;
      }
      .toast {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: calc(100px + env(safe-area-inset-bottom, 0px));
        background: var(--tx);
        color: var(--bg);
        padding: 10px 18px;
        border-radius: 999px;
        z-index: 99;
        max-width: 90%;
        text-align: center;
      }
      @media (min-width: 821px) {
        #mo {
          align-items: center;
        }
        .sh {
          border-radius: 22px;
        }
      }
      @media (max-width: 820px) {
        .app {
          display: block;
        }
        aside {
          position: fixed;
          left: 0;
          right: 0;
          bottom: 0;
          top: auto;
          max-height: none;
          flex-direction: row;
          justify-content: space-around;
          padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px));
          z-index: 30;
        }
        .br {
          display: none;
        }
        aside button {
          flex-direction: column;
          gap: 0;
          padding: 6px 2px;
          font-size: 11px;
          flex: 1;
          align-items: center;
        }
        main {
          padding: 18px 16px 130px;
        }
        #fab {
          bottom: calc(76px + env(safe-area-inset-bottom, 0px));
        }
        .rh {
          grid-template-columns: 1fr 90px;
        }
        .rh .gg {
          grid-column: 1/-1;
          order: 3;
        }
        h1 {
          font-size: 25px;
        }
      }
      body {
        background: transparent;
      }
      #bg {
        position: fixed;
        inset: 0;
        z-index: -1;
        overflow: hidden;
        background: var(--bg);
      }
      #bg svg {
        width: 100%;
        height: 100%;
        filter: blur(18px) saturate(1.15);
        transform: scale(1.12);
      }
      #bg::after {
        content: "";
        position: absolute;
        inset: 0;
        background: var(--ov);
      }
      .cd,
      .tl,
      .k,
      .pc,
      .chips button,
      .x2 {
        -webkit-backdrop-filter: blur(18px) saturate(1.4);
        backdrop-filter: blur(18px) saturate(1.4);
        border: 1px solid var(--gb);
      }
      .cd,
      .tl,
      .pc,
      .k {
        box-shadow:
          0 10px 34px rgba(50, 70, 80, 0.14),
          0 0 0 1px rgba(40, 60, 60, 0.05),
          inset 0 1px 0 rgba(255, 255, 255, 0.9),
          inset 0 -1px 0 rgba(255, 255, 255, 0.4);
      }
      .tl.sel {
        border-color: var(--ac);
      }
      .chips button.on {
        border-color: var(--ink);
      }
      .sh {
        background: var(--sh);
        -webkit-backdrop-filter: blur(26px) saturate(1.5);
        backdrop-filter: blur(26px) saturate(1.5);
        border: 1px solid var(--gb);
      }
      aside {
        background: rgba(14, 22, 19, 0.5);
        -webkit-backdrop-filter: blur(22px) saturate(1.4);
        backdrop-filter: blur(22px) saturate(1.4);
        border-right: 1px solid rgba(255, 255, 255, 0.12);
      }
      .pill {
        background: rgba(14, 22, 19, 0.72);
        -webkit-backdrop-filter: blur(18px);
        backdrop-filter: blur(18px);
        border: 1px solid rgba(255, 255, 255, 0.18);
      }
      .toast {
        background: rgba(18, 34, 31, 0.94);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.2);
      }
      @media (max-width: 820px) {
        aside {
          border-right: 0;
          border-top: 1px solid rgba(255, 255, 255, 0.14);
        }
      }
      .pvw {
        width: min(100%, 300px);
        aspect-ratio: 4/3;
        margin: 12px auto 8px;
        border-radius: 18px;
        overflow: hidden;
        border: 1px solid var(--gb);
        box-shadow: 0 8px 24px rgba(40, 60, 60, 0.18);
      }
      .pvw img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        display: block;
      }
      input[type="range"] {
        padding: 0;
        border: 0;
        background: none;
        accent-color: var(--ac);
      }
      .tl img,
      .tl .ph,
      .pc img,
      .pc .ph {
        aspect-ratio: 4/3;
        height: auto;
        object-fit: cover;
        object-position: center;
      }
      .tg {
        grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
        gap: 10px;
      }
      .tl {
        border-radius: 14px;
      }
      .tl .tb {
        padding: 8px 10px;
      }
      .tl .tb b {
        font-size: 14px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .tl .tb .mu {
        font-size: 12px;
      }
      .tl .ph,
      .pc .ph {
        font-size: 26px;
      }
      .qb {
        top: 6px;
        right: 6px;
      }
      .qb button {
        width: 24px;
        height: 24px;
        font-size: 16px;
      }
      .qb span {
        font-size: 13px;
      }
      .pr {
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 12px;
      }
      .pc {
        border-radius: 14px;
      }
      .pc .tb {
        padding: 10px 12px;
      }
      .pc h2 {
        font-size: 15px;
      }
      .pc pre {
        font-size: 12px;
      }
      .pc .mu {
        font-size: 12px;
      }
      .pc img,
      .pc .ph {
        aspect-ratio: 16/10;
      }
      .pvw {
        width: min(100%, 200px);
        border-radius: 14px;
      }
      .tl img,
      .tl .ph {
        aspect-ratio: auto;
        height: 74px;
        width: calc(100% - 16px);
        margin: 8px 8px 0;
        border-radius: 10px;
      }
      .pr {
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      }
      .pc {
        display: grid;
        grid-template-columns: 76px 1fr;
        gap: 12px;
        padding: 10px;
        align-items: start;
      }
      .pc img,
      .pc .ph {
        width: 76px;
        height: 76px;
        aspect-ratio: 1;
        border-radius: 12px;
      }
      .pc .tb {
        padding: 0;
      }
      .pvw {
        width: 150px;
        aspect-ratio: 1;
      }
      .pr {
        grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      }

        SYNC = "Conectando…",
        WQ = Promise.resolve();
      function fail(e) {
        toast(
          e && (e.code == "invalid_argument" || e.code == "permission-denied")
            ? "No tienes permiso para guardar cambios"
            : e && e.code == "quota_exceeded"
              ? "La base de datos está llena"

      function lsave() {
        try {
          localStorage.setItem(LK, JSON.stringify(C));

          toast("Almacenamiento lleno");

      }
      function put(c, id, d) {
        C[c][id] = d;
        if (DB) WQ = WQ.then(() => DB.doc(c + "/" + id).set(d)).catch(fail);
        else lsave();
        rebuild();
      }
      function rm(c, id) {
        delete C[c][id];
        if (DB) WQ = WQ.then(() => DB.doc(c + "/" + id).delete()).catch(fail);
        else lsave();
        rebuild();
      }
      function emit(date, evs) {
        const id = date + "_" + UID,
          E = evs.map((e) => ({ id: uid(), t: Date.now(), date, ...e })),
          cur = C.led[id]?.ev || [];
        C.led[id] = { date, uid: UID, ev: [...cur, ...E] };
        WQ = WQ.then(() =>
          DB.doc("led/" + id).set(
            {
              date,
              uid: UID,
              ev: firebase.firestore.FieldValue.arrayUnion(...E),
            },
            { merge: true },
          ),
        ).catch(fail);
        rebuild();
      }
      function rebuild() {
        S.ing = Object.entries(C.ing).map(([id, d]) => ({
          ...d,
          id,
          stock: 0,
          unit: d.unit == "un" ? "und" : d.unit,
        }));
        S.prod = Object.entries(C.prod).map(([id, d]) => ({ ...d, id }));
        S.prov = Object.entries(C.prov || {}).map(([id, d]) => ({
          ...d,
          id,
          items: d.items || [],
        }));
        S.cal = Object.entries(C.cal || {}).map(([id, d]) => ({ ...d, id }));
        S.cfg = (C.cfg || {}).pred || {};
        const evs = [];
        Object.values(C.led).forEach((d) =>
          (d.ev || []).forEach((e) => evs.push(e)),
        );
        const vo = new Set(evs.filter((e) => e.k == "x").map((e) => e.ref)),
          ok = evs
            .filter((e) => e.k != "x" && !vo.has(e.id))
            .sort((a, b) => a.t - b.t),
          st = {};
        S.ing.forEach((p) => (st[p.id] = 0));
        ok.forEach((e) => {
          if (e.k == "set") {
            if (e.iid in st) st[e.iid] = e.v;
          } else if (e.k == "in") {
            if (e.iid in st) st[e.iid] += e.v;
          } else if (e.k == "rc") {
            (e.items || []).forEach((i) => {
              if (i.iid in st) st[i.iid] += i.q;
            });
          } else for (const k in e.use || {}) if (k in st) st[k] -= e.use[k];
        });
        S.ing.forEach((p) => (p.stock = st[p.id]));
        S.sales = ok.filter((e) => e.k == "s");
        S.waste = ok.filter((e) => e.k == "w");
        S.recv = ok.filter((e) => e.k == "rc");
        draw();
      }
      const FIREBASE_CONFIG = {
        apiKey: "AIzaSyDwjL1CmmMTqFh8PVYeuTHk7c_wV5qEhdA",
        authDomain: "velezartisan.firebaseapp.com",

        appId: "1:169095749123:web:571d033abbd52cc6a13836",

      let AUTH = null,
        UNSUB = [];

        try {
          let d = localStorage.getItem("dev");
          if (!d) {
            d = uid();
            localStorage.setItem("dev", d);

          return d;
        } catch (e) {
          return uid();
        }
      }
      function lmsg(m) {
        const e = $("#lm");
        if (e) e.textContent = m;
      }
      async function init() {
        if (
          !window.firebase ||
          /PEGA_AQUI|TU-PROYECTO/.test(JSON.stringify(FIREBASE_CONFIG))
        ) {
          $("#lg").className = "on";
          lmsg(
            "Falta configurar Firebase: abre index.html y pega tu configuración (paso 4 de la guía).",
          );
          $("#lb").disabled = true;
          return;
        }
        firebase.initializeApp(FIREBASE_CONFIG);
        AUTH = firebase.auth();
        DB = firebase.firestore();
        UID = devId();
        AUTH.onAuthStateChanged((u) => {
          UNSUB.forEach((f) => f());
          UNSUB = [];
          if (!u) {
            READY = false;
            for (const k in C) C[k] = {};
            $("#lg").className = "on";
            draw();
            return;
          }
          $("#lg").className = "";
          SYNC = "Conectando…";
          draw();
          ["ing", "prod", "led", "prov", "cfg", "cal"].forEach((c) =>
            UNSUB.push(
              DB.collection(c).onSnapshot(
                (sn) => {
                  C[c] = {};
                  sn.docs.forEach((d) => (C[c][d.id] = d.data()));
                  READY = true;
                  SYNC = "";
                  rebuild();
                },
                (e) => {
                  SYNC = "Sin conexión con la base de datos";
                  draw();
                },
              ),
            ),
          );
        });
      }
      async function login() {
        const e = $("#le").value.trim(),
          p = $("#lp").value;
        if (!e || !p) return lmsg("Escribe tu correo y tu clave");
        $("#lb").disabled = true;
        lmsg("");
        try {
          await AUTH.signInWithEmailAndPassword(e, p);
          $("#lp").value = "";
        } catch (x) {
          const c = (x && x.code) || "";
          lmsg(
            /invalid-credential|wrong-password|user-not-found|invalid-email/.test(
              c,
            )
              ? "Correo o clave incorrectos"
              : /too-many/.test(c)
                ? "Demasiados intentos. Espera unos minutos e intenta de nuevo"
                : /network/.test(c)
                  ? "Sin conexión a internet"
                  : "No se pudo iniciar sesión",
          );
        }
        $("#lb").disabled = false;
      }
      function logout() {
        if (AUTH) AUTH.signOut();
      }
      const OLD = () => null;
      function importOld() {
        const r = OLD();
        if (!r) return;
        const led = {},
          t0 = Date.now();
        let n = 0;
        const push = (date, e) => {
          (led[date] = led[date] || []).push({
            id: uid(),
            t: new Date(date + "T12:00:00").getTime() + n++,
            date,
            ...e,
          });
        };
        r.ing.forEach((i) =>
          put("ing", i.id, {
            name: i.name,
            cat: i.cat,
            unit: i.unit,
            cost: i.cost,
            min: i.min,
          }),
        );
        r.prod.forEach((p) =>
          put("prod", p.id, {
            name: p.name,
            price: p.price,
            photo: p.photo || "",
            steps: p.steps || "",
            lines: p.lines,
          }),
        );
        (r.sales || []).forEach((x) =>
          push(x.date, {
            k: "s",
            nm: x.nm,
            qty: x.qty,
            rev: x.rev,
            use: x.use,
          }),
        );
        (r.waste || []).forEach((x) =>
          push(x.date, {
            k: "w",
            nm: x.nm,
            qty: x.qty,
            reason: x.reason,
            use: x.use,
          }),
        );
        r.ing.forEach((i) =>
          push(today(), { k: "set", iid: i.id, v: i.stock }),
        );
        Object.entries(led).forEach(([d, ev]) => {
          ev.forEach((e) => {
            if (e.k == "set") e.t = t0 + n++;
          });
          const id = d + "_" + UID,
            cur = C.led[id]?.ev || [];
          put("led", id, { date: d, uid: UID, ev: [...cur, ...ev] });
        });
        toast("Datos importados");
      }
      const $ = (s) => document.querySelector(s),
        uid = () => Math.random().toString(36).slice(2, 9);
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );
      const today = () => daysAgo(0);
      function daysAgo(n) {
        const d = new Date();
        d.setDate(d.getDate() - n);
        return new Date(d - d.getTimezoneOffset() * 6e4)
          .toISOString()
          .slice(0, 10);
      }
      let ui = {
        tab: "res",
        q: "",
        cat: "Todas",
        open: "",

        col: "eq",
        vd: today(),
        wp: 30,
        del: "",
      };
      const I = (id) => S.ing.find((p) => p.id == id),
        PR = (id) => S.prod.find((p) => p.id == id),
        num = (v) => parseFloat(v) || 0,
        r2 = (n) => +(+n).toFixed(2);
      const money = (n) => {
          const r = Math.round(n);

            (r < 0 ? "-" : "") +
            "$" +
            String(Math.abs(r)).replace(/\B(?=(\d{3})+(?!\d))/g, ".")

      /* gráficos */
      function bars(d) {
        const m = Math.max(1, ...d.map((x) => x.v)),
          w = 300 / d.length;
        return `<svg viewBox="0 0 300 130" class="ch" role="img" aria-label="Ventas por día">${d
          .map((x, i) => {
            const h = (x.v / m) * 80;
            return `<rect x="${i * w + w * 0.17}" y="${100 - h}" width="${w * 0.66}" height="${Math.max(h, 2)}" rx="7" style="--d:${i * 70}ms" class="${x.hi ? "hi" : ""}"><title>${esc(x.l)}: ${money(x.v)}</title></rect><text x="${i * w + w / 2}" y="117" text-anchor="middle">${esc(x.l)}</text>${x.v ? `<text class="vl" x="${i * w + w / 2}" y="${96 - h}" text-anchor="middle">${short(x.v)}</text>` : ""}`;
          })
          .join("")}</svg>`;

      function donut(o) {
        const e = Object.entries(o).sort((a, b) => b[1] - a[1]),
          tot = e.reduce((a, x) => a + x[1], 0);
        if (!tot) return `<p class="mu">Sin datos todavía</p>`;
        let off = 25;
        return `<div class="dn"><svg viewBox="0 0 42 42" width="140" height="140"><circle cx="21" cy="21" r="15.9155" fill="none" stroke="var(--ln)" stroke-width="5"/>${e
          .map(([k, v], i) => {
            const p = (v / tot) * 100,
              s = `<circle cx="21" cy="21" r="15.9155" fill="none" stroke="var(--c${(i % 5) + 1})" stroke-width="5" stroke-dasharray="${p} ${100 - p}" stroke-dashoffset="${off}" style="--d:${i * 120}ms"><title>${esc(k)}: ${money(v)}</title></circle>`;
            off -= p;
            return s;

        [...S.sales, ...S.waste].forEach((e) => {

          }
        });
        const d = Math.round((t0 - new Date(first + "T12:00:00")) / 864e5) + 1,
          nW = Math.min(4, Math.floor(d / 7)),
          W = [0.4, 0.3, 0.2, 0.1].slice(0, nW),
          out = {};
        S.ing.forEach((p) => {
          const v = (wk[p.id] || [0, 0, 0, 0]).slice(0, nW);
          let base, sd;
          if (!nW) {
            base = ((tot[p.id] || 0) / d) * 7;
            sd = 0.2 * base;
          } else {
            base =
              v.reduce((a, x, i) => a + x * W[i], 0) /
              W.reduce((a, b) => a + b);
            const m = v.reduce((a, b) => a + b) / nW;
            sd =
              nW > 1
                ? Math.sqrt(v.reduce((a, x) => a + (x - m) ** 2, 0) / (nW - 1))
                : 0.2 * base;
          }
          out[p.id] = { base, sd };
        });
        return { out, nW, d };
      }
      function nearFest(d) {
        for (const o of [1, 2, 3, -1, -2, -3]) {
          const n = FN[addD(d, o)];
          if (n) return n;
        }
        return "";
      }
      function dayInfo(d, M, st) {
        const t = dtype(d),
          c = S.cal.find((x) => x.date == d);
        return {
          d,
          t,
          nm: c
            ? c.name
            : t == "fest"
              ? FN[d] || ""
              : t == "n"
                ? ""
                : nearFest(d),
          f: t == "esp" ? 1 + num(c.pct) / 100 : t == "n" ? 1 : M[t].f,
          idx: st.idx[wdOf(d)],
        };
      }
      function wcell(x) {
        const past = x.d < today();
        return `<div class="wd ${x.t != "n" ? "hot" : ""} ${past ? "past" : ""} ${x.d == today() ? "today" : ""}"><span>${WDN[wdOf(x.d)]}</span><b>${+x.d.slice(8)}</b><i class="tg2">${x.t == "n" ? "" : x.t == "esp" ? "Especial" : TG[x.t]}</i><span class="fn">${esc(x.nm || "")}</span><span class="mu">${x.t == "n" ? "" : "×" + fx(x.f)}</span></div>`;
      }
      function fcast() {
        const M = mult(),
          st = wdStats(),
          days = [...Array(7)].map((_, i) =>
            dayInfo(addD(today(), i + 1), M, st),
          ),
          U =
            days.reduce((a, x) => a + x.idx * x.f, 0) /
            days.reduce((a, x) => a + x.idx, 0),
          mon = addD(today(), -((wdOf(today()) + 6) % 7)),
          wks = [0, 1].map((w) =>
            [...Array(7)].map((_, i) => dayInfo(addD(mon, w * 7 + i), M, st)),
          ),
          wU = wks.map(
            (a) =>
              a.reduce((s, x) => s + x.idx * x.f, 0) /
              a.reduce((s, x) => s + x.idx, 0),
          );
        return { M, st, days, U, wks, wU, W: weekly() };
      }
      function calModal() {
        const M = mult(),
          up = S.cal
            .filter((x) => x.date >= today())
            .sort((a, b) => a.date.localeCompare(b.date)),
          ln = (t, l) =>
            `${l}: ${M[t].n ? `${M[t].n} día${M[t].n > 1 ? "s" : ""} con ventas, ×${fx(M[t].f)}` : `sin datos aún, ×${fx(M[t].f)}`}`;
        modal(
          "Ajustes de predicción",
          `<p class="mu">Estos porcentajes suben la demanda prevista en esos días. Cuando tengas ventas de festivos y puentes pasados, la plataforma las usa para afinar el valor.</p><div class="fm"><label>Festivo (%)<input id="cf" type="number" value="${S.cfg.fest != null ? S.cfg.fest : DEF.fest}"></label><label>Puente (%)<input id="cp" type="number" value="${S.cfg.puen != null ? S.cfg.puen : DEF.puen}"></label><label>Víspera (%)<input id="cv" type="number" value="${S.cfg.visp != null ? S.cfg.visp : DEF.visp}"></label></div><p class="mu">Usado hoy: ${ln("fest", "Festivo")} · ${ln("puen", "Puente")} · ${ln("visp", "Víspera")}</p><p style="margin:10px 0"><button class="btn" onclick="saveCfg()">Guardar porcentajes</button></p><h2 style="margin-top:16px">Días especiales</h2><p class="mu">Ferias, eventos, temporada alta… que no sean festivos.</p><div class="fm"><label>Fecha<input id="sd2" type="date"></label><label>Aumento (%)<input id="sp2" type="number" value="25"></label><label class="w2">Nombre<input id="sn2" placeholder="Feria, evento…"></label></div><p style="margin:8px 0"><button class="btn s" onclick="addCal()">Agregar día especial</button></p>${up.map((x) => `<div class="li"><span>${x.date} · ${esc(x.name || "Especial")} <span class="mu">+${x.pct}%</span></span><button class="btn x" onclick="rm('cal','${x.id}');calModal()">Quitar</button></div>`).join("")}`,
        );
      }
      function saveCfg() {
        put("cfg", "pred", {
          fest: num($("#cf").value),
          puen: num($("#cp").value),
          visp: num($("#cv").value),
        });
        closeM();
        toast("Ajustes guardados");
      }
      function addCal() {
        const d = $("#sd2").value;
        if (!d) return toast("Elige la fecha");
        put("cal", uid(), {
          date: d,
          name: $("#sn2").value.trim(),
          pct: num($("#sp2").value),
        });
        calModal();
      }
      function lostVal(k, id, q) {
        if (k == "p") {
          const p = PR(id);
          return p ? q * p.price : 0;
        }
        const c = cons().by30[id] || {},
          ps = S.prod.filter((p) => p.lines.some((l) => l.iid == id));
        if (!ps.length) return 0;
        const p = ps.sort((a, b) => (c[b.name] || 0) - (c[a.name] || 0))[0],
          l = p.lines.find((l) => l.iid == id);
        return (q / l.qty) * p.price;
      }
      const wsv = (w) => {
        if (w.val != null) return w.val;
        const p = S.prod.find((x) => x.name == w.nm);
        if (p) return w.qty * p.price;
        const id = Object.keys(w.use || {})[0];
        return id ? lostVal("i", id, w.qty) : 0;
      };
      function tbl(R) {
        const w = [0, 1, 2, 3].map((i) =>
            Math.max(...R.map((r) => r[i].length)),
          ),
          c = (t, n) => {
            const d = n - t.length,
              l = Math.floor(d / 2);
            return " ".repeat(l) + t + " ".repeat(d - l);
          },
          line = (r) =>
            r
              .map((t, i) => c(t, w[i]))
              .join(" | ")
              .trimEnd();
        return [
          line(R[0]),
          w.map((n) => "-".repeat(n)).join("-+-"),
          ...R.slice(1).map(line),
        ].join("\n");
      }
      function buildOrder(k) {
        const box = $("#pv" + k);
        if (!box) return;
        const sp = PV(k),
          L = [...box.querySelectorAll(".or")]
            .filter(
              (r) =>
                r.querySelector(".oc").checked &&
                num(r.querySelector(".oq").value) > 0,
            )
            .map((r) => {
              const p = I(r.querySelector(".oc").dataset.id),
                q = num(r.querySelector(".oq").value);
              return [
                p.name,
                fq(p.stock, p.unit),
                fq(q, p.unit),
                [
                  p.pkq
                    ? pl(Math.ceil(q / p.pkq), p.pkn || "presentación") +
                      " de " +
                      fq(p.pkq, p.unit)
                    : "",
                  r.querySelector(".onr").value.trim(),
                ]
                  .filter(Boolean)
                  .join(" · "),
              ];
            }),
          t = $("#ot" + k);
        t.style.display = "block";
        $("#oh" + k).style.display = "block";
        t.value = L.length
          ? `Pedido ARTISAN CAFÉ${sp ? " para " + sp.name : ""}\n\n` +
            tbl([["Producto", "Stock", "Pedido", "Notas"], ...L])
          : "Con tu stock actual y la demanda prevista no hace falta pedir nada de este proveedor. Si quieres pedir algo, escribe la cantidad en el ingrediente.";
        $("#cp" + k).disabled = !L.length;
      }
      function togOrder(c, k) {
        const r = c.closest(".or"),
          q = r.querySelector(".oq");
        if (c.checked) {
          const a = num(q.dataset.s),
            w = num(q.dataset.w);
          q.value = a > 0 ? a : w;
        } else q.value = 0;
        r.classList.toggle("off", !c.checked);
        refOrder(k);
      }
      function qtyIn(q, k) {
        const r = q.closest(".or"),
          on = num(q.value) > 0;
        r.querySelector(".oc").checked = on;
        r.classList.toggle("off", !on);
        refOrder(k);
      }
      function resetOrder(k) {
        const box = $("#pv" + k);
        box.querySelectorAll(".or").forEach((r) => {
          const q = r.querySelector(".oq"),
            v = num(q.dataset.s);
          q.value = v;
          r.querySelector(".oc").checked = v > 0;
          r.classList.toggle("off", !(v > 0));
        });
        buildOrder(k);
      }
      function mkOrder(k) {
        const box = $("#pv" + k);
        if (!box) return;
        box.dataset.gen = 1;
        buildOrder(k);
      }
      function refOrder(k) {
        const box = $("#pv" + k);
        if (box && box.dataset.gen) buildOrder(k);
      }
      function copyOrder(k) {
        const t = $("#ot" + k),
          ok = () => toast("Pedido copiado");
        t.select();
        try {
          navigator.clipboard.writeText(t.value).then(ok, () => {
            document.execCommand("copy");
            ok();
          });
        } catch (e) {
          document.execCommand("copy");
          ok();
        }
      }
      function demo() {
        const mk = (name, cat, unit, cost, min, stock) => ({

            name,
            cat,
            unit,
            cost,
            min,
            stock,

        const L = (n, q) => ({ iid: ing.find((i) => i.name == n).id, qty: q }),
          prod = [
            {

              lines: [L("Café en grano", 18), L("Vasos", 1)],

            {

                L("Café en grano", 18),

            {

              photo: "",
              steps: "Pan, jamón y queso a la plancha.",
              lines: [L("Pan", 1), L("Jamón", 40), L("Queso", 30)],
            },
          ];
        const PK = {
          "Café en grano": ["bolsa", 500],
          Leche: ["bolsa", 900],
          Azúcar: ["bolsa", 1000],
          Pan: ["paquete", 12],
          Queso: ["bloque", 500],

        };
        ing.forEach((i) => {
          if (PK[i.name]) {
            i.pkn = PK[i.name][0];
            i.pkq = PK[i.name][1];
          }
        });
        const led = {};

        const push = (date, e) => {
          (led[date] = led[date] || []).push({
            id: uid(),

        ing.forEach((i) => {
          put("ing", i.id, {

            unit: i.unit,
            cost: i.cost,
            min: i.min,
            pkn: i.pkn || "",
            pkq: i.pkq || 0,
          });
          push(daysAgo(7), { k: "set", iid: i.id, v: i.stock });
        });
        prod.forEach((p) =>
          put("prod", p.id, {
            name: p.name,
            price: p.price,
            photo: "",
            steps: p.steps,
            lines: p.lines,
          }),
        );
        [
          [
            "Café Andino S.A.S.",
            "300 111 2233",
            "Entrega martes y viernes",
            ["Café en grano", "Azúcar"],
          ],
          [

        ].forEach(([n, ph, no, it]) =>
          put("prov", uid(), {
            name: n,

            items: it.map((x) => ing.find((i) => i.name == x).id),

        );
        for (let d = 6; d >= 0; d--)
          prod.forEach((p, j) => {
            const q = ((d * 3 + j * 2) % 5) + 2,
              u = {};
            p.lines.forEach((l) => (u[l.iid] = l.qty * q));
            push(daysAgo(d), {
              k: "s",
              nm: p.name,
              qty: q,
              rev: q * p.price,
              use: u,
            });
          });
        [
          ["Leche", 800, "Caducado", 2],
          ["Pan", 3, "Dañado", 1],
          ["Café en grano", 60, "Derrame", 3],
          ["Leche", 400, "Error de preparación", 4],
        ].forEach(([nm, q, r, d]) => {
          const i = ing.find((x) => x.name == nm);
          push(daysAgo(d), {
            k: "w",
            nm,
            qty: q,
            reason: r,
            use: { [i.id]: q },
          });
        });
        Object.entries(led).forEach(([d, ev]) =>
          put("led", d + "_" + UID, { date: d, uid: UID, ev }),
        );
      }
      document.addEventListener("keydown", (e) => {
        if (e.key == "Escape") closeM();
      });
      draw();
      init();
    </script>
